name: Maestro E2E

on:
  push:
    branches:
      - master
      - staging

concurrency:
  group: maestro-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-e2e:
    name: Android Maestro E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Restore Bun cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Maestro
        run: curl -fsSL https://get.maestro.mobile.dev | bash

      - name: Run Android E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_8
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            export PATH="$PATH:$HOME/.maestro/bin"
            cd apps/native
            APP_ENV=ci bunx expo run:android --variant release --no-build-cache --no-install --no-bundler
            cd ../..
            maestro test apps/native/E2E/full

  ios-e2e:
    name: iOS Maestro E2E
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Restore Bun cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Maestro
        run: curl -fsSL https://get.maestro.mobile.dev | bash

      - name: Run iOS E2E
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.maestro/bin"
          SIMULATOR_ID="$(xcrun simctl list devices available | grep -m 1 'iPhone' | sed -E 's/.*\(([-A-F0-9]+)\) \(.*/\1/')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found."
            exit 1
          fi
          cd apps/native
          APP_ENV=ci bunx expo run:ios --device "$SIMULATOR_ID" --configuration Release --no-build-cache --no-install --no-bundler
          cd ../..
          maestro test apps/native/E2E/full
