# Lefthook configuration
# https://github.com/evilmartians/lefthook

glob_matcher: doublestar

pre-commit:
  jobs:
    - name: turbo-check
      run: bun turbo run format lint check-types

pre-push:
  jobs:
    - name: turbo-check
      run: bunx turbo run lint format check-types

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}
